name: weekly-status-check

on:
  schedule:
    # Every Monday 02:00 UTC — keep the "actively maintained" promise honest.
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run status check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_tools.py --out STATUS.md

      # Write .github/bad.txt only when something is actually wrong,
      # so the "Create issue" step below only fires when needed.
      - name: Collect bad verdicts
        run: |
          python3 - <<'EOF'
          import pathlib
          lines = pathlib.Path(".github/report.txt").read_text(encoding="utf-8").splitlines()
          bad = [l for l in lines if l.startswith(("❌", "⚠️"))]
          if bad:
              pathlib.Path(".github/bad.txt").write_text("\n".join(bad) + "\n", encoding="utf-8")
              print(f"found {len(bad)} problematic repo(s)")
          else:
              print("all repos healthy")
          EOF

      - name: Open issue if any repo died (once per 7 days)
        if: hashFiles('.github/bad.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="⚠️ Stale/archived tools detected ($(date +%F))"
          EXISTS=$(gh issue list --state open --limit 100 --json title \
            -q '.[].title' | grep -c "Stale/archived tools detected" || true)
          if [ "$EXISTS" -eq 0 ]; then
            gh issue create --title "$TITLE" --body "$(cat .github/report.txt)"
          else
            echo "An issue for this round is already open, skipping."
          fi

      - name: Commit refreshed STATUS.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATUS.md
          if git diff --cached --quiet; then
            echo "No changes to STATUS.md"
          else
            git commit -m "chore: refresh status report ($(date +%F))"
            git push
          fi